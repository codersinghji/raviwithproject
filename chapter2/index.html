<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fuddo Food Menu</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header>
        <h1>Fuddo Food Menu</h1>
    </header>

    <div class="search-box">
        <input type="text" placeholder="🔍 Search for food items...">
    </div>

    <main class="main-box">

        <section class="food-section">
            <h2>Food Items</h2>

            <div class="food-grid">

                <div class="food-card">
                    <img src="/burger.jpeg">
                    <h3>Veg Burger</h3>
                    <p>₹120</p>
                    <button>Add to Cart</button>
                </div>

                <div class="food-card">
                    <img src="/burger.jpeg">
                    <h3>Paneer Pizza</h3>
                    <p>₹250</p>
                    <button>Add to Cart</button>
                </div>

                <div class="food-card">
                    <img src="/burger.jpeg">
                    <h3>Pasta</h3>
                    <p>₹180</p>
                    <button>Add to Cart</button>
                </div>

                <div class="food-card">
                    <img src="/burger.jpeg">
                    <h3>Veg Sandwich</h3>
                    <p>₹100</p>
                    <button>Add to Cart</button>
                </div>

                <div class="food-card">
                    <img src="/burger.jpeg">
                    <h3>Veg Noodles</h3>
                    <p>₹150</p>
                    <button>Add to Cart</button>
                </div>

                <div class="food-card">
                    <img src="/burger.jpeg">
                    <h3>French Fries</h3>
                    <p>₹90</p>
                    <button>Add to Cart</button>
                </div>

            </div>
        </section>

        <section class="cart-section">
            <h2>Cart</h2>

            <div class="cart-item">
                <img src="/burger.jpeg">
                <div>
                    <h3>Veg Burger</h3>
                    <p>₹120</p>
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
                <button class="remove">×</button>
            </div>

            <div class="total">
                <h2>Total Price</h2>
                <h2>₹120</h2>
            </div>
        </section>

    </main>

</body>
</html>
