<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Guess a Number</title>
</head>

<body>

    <div id="game">

        <h1>Number Guessing Game</h1>

        <p>Try and guess a random number between 1 and 100!</p>
        <p>You have 10 attempts to guess the number.</p>

        <form class="form">

            <label for="guessField" id="guess">
                Guess a number:
            </label>

            <input type="text"
                   id="guessField"
                   class="guessField">

            <input type="submit"
                   id="subt"
                   value="Submit Guess"
                   class="guessSubmit">

        </form>

        <div class="resultParas">

            <p>
                Previous Guesses:
                <span id="guesses"></span>
            </p>

            <p>
                Guesses Remaining:
                <span id="remaining">10</span>
            </p>

            <p class="lowOrHigh"></p>

        </div>

    </div>

    <script src="index.js"></script>

</body>
</html>
